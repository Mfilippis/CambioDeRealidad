<section id="conta">
  <div class="container">
    <h2 class="section-title">Contá tu historia o recomendanos algo</h2>
    <p class="section-sub">Podés compartir una historia breve o recomendar una meditación, charla o libro.</p>

    <div class="panel form-wrapper">
      <form id="storyForm" data-endpoint="https://formspree.io/f/xnnzebyn" novalidate>
        <div class="grid-2-simple">
          <div>
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" type="text" placeholder="Tu nombre" />
          </div>

          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="tu@correo.com" />
            <div class="hint">Solo para poder responderte (opcional).</div>
          </div>

          <div>
            <label for="tipo">¿Qué querés compartir?</label>
            <select id="tipo" name="tipo">
              <option>Historia</option>
              <option>Recomendación: meditación</option>
              <option>Recomendación: charla</option>
              <option>Recomendación: libro</option>
            </select>
          </div>

          <div>
            <label for="link">Link recomendado (opcional)</label>
            <input id="link" name="link" type="url" placeholder="Pega el enlace de YouTube o del libro" />
          </div>

          <div class="field-full">
            <label for="historia">Tu experiencia o explicación</label>
            <textarea id="historia" name="historia" rows="2"
              placeholder="Contanos tu experiencia o por qué lo recomendás…"></textarea>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Enviar</button>
          <button class="btn btn-outline" type="reset">Limpiar</button>
        </div>

        <div id="msgOk"  class="msg-ok"  style="display:none" role="status" aria-live="polite">¡Enviado! Gracias por compartir 💜</div>
        <div id="msgErr" class="msg-err" style="display:none" role="alert"  aria-live="assertive">
          Ups, no pude enviar el formulario ahora. Probá de nuevo en unos minutos.
        </div>
      </form>
    </div>
  </div>
</section>
