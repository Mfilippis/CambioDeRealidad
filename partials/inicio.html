<section id="home">
  <div class="container">
    <div class="hero panel">
      <div class="hero-grid">
        <div class="hero-copy">
          <p class="kicker">Una comunidad para reescribir tu historia</p>
          <h1 class="hero-title">
            TuNueva <span>Narrativa</span>
          </h1>
          <p class="hero-sub">
            Historias reales de micro-cambios. Inspirada por prácticas de conciencia,
            elegimos palabras que nos expanden: de <em>“tengo que”</em> a <em>“elijo”</em>.
          </p>

          <div class="hero-actions">
            <a class="btn btn-primary" href="#/conta-tu-historia">Contá tu historia</a>
            <a class="btn btn-outline" href="#/historias">Ver historias</a>
          </div>
        </div>

        <div class="hero-art">
          <!--
            1) Intenta cargar el logo en assets/
            2) Si falla, prueba con portada.png en la raíz
            3) Si también falla, oculta la imagen para que no quede el ícono roto
          -->
          <img
            src="./assets/tnn_logo_yellow_bg_soft.png"
            alt="TuNuevaNarrativa"
            loading="eager"
            onerror="
              if (this.dataset.step === '1') {
                this.dataset.step='2';
                this.src='./portada.png';
              } else {
                this.closest('.hero-art').style.display='none';
              }
            "
            data-step="1"
          />
        </div>
      </div>
    </div>
  </div>
</section>
